.score-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.scorebox{border:1px solid #445f80;border-radius:15px;background:#1a3150;padding:16px}.teamname{width:100%;min-width:0;border:1px solid #45617e;background:#11243c;color:#e9f7ff;border-radius:8px;padding:9px 7px;font-size:14px;text-align:center}.points{font-size:46px;font-weight:900;color:var(--gold);text-align:center;margin:10px auto;font-variant-numeric:tabular-nums}.scorebuttons{display:flex;gap:7px;justify-content:center}.scorebuttons button{flex:1;padding:8px 4px;font-size:17px;border-radius:8px;border:1px solid #5d7b9d;background:#294b73;color:white}.scorebuttons button.plus{background:#126554;border-color:#39937e}.winner{margin:20px 0;color:var(--gold);font-size:24px;font-weight:780;min-height:38px}.notice{color:var(--muted);line-height:1.65}.timebadge{font-weight:900;font-variant-numeric:tabular-nums;font-size:38px;color:var(--gold);line-height:1}.timerbox{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#152840;border:1px solid var(--line);border-radius:11px}.timerbox button{color:white;background:transparent;border:0;font-size:14px}.timer-controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.timer-controls button{padding:8px 11px;color:white;border:1px solid #557290;background:#243e5e;border-radius:9px}.timer-controls .active{background:#226357}.timelabel{font-size:13px;color:var(--muted)}.timerarea{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:16px 0}.footer{color:#9ab4d2;font-size:13px;text-align:center;padding:26px 10px}.mobiletimer{display:none}.progress{height:8px;border-radius:20px;background:#27415f;overflow:hidden;margin:15px 0 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));transition:width .2s}.welcome{font-size:26px;font-weight:750;line-height:1.4}.week-pills{margin-top:8px;color:var(--muted);font-size:14px}

<script>
'use strict';
const DAYS=[{"week":1,"title":"Тайната на библиотеката","subtitle":"Открий кода, следвай уликите, създай шифър","focus":"логика, четене с разбиране, сътрудничество","materials":"листове, химикалки, пликове (по избор)","warm":"Пантомима: „книга“, „лупа“, „ключ“; отборът познава без подсказващи звуци.","task1":"Разчети двете думи по азбуката (А=1, Б=2, ..., Я=30): 11-15-5 и 11-12-29-24.","task2":"От четири действия образувай код: 2×3; 12÷3; 5+2; 9−8. Напиши четирите цифри последователно.","mission":"Всеки отбор съставя тайно послание от 3–5 думи с числов шифър, добавя две честни улики и го разменя с друг отбор. Разкодирането се удостоверява с оригинала.","bonus":"Напиши кратък детективски разказ, в който кодът води до намерена книга, а не до опасна ситуация.","solution":"Задача 1: КОД и КЛЮЧ. Задача 2: 6471. Проверете дали шифърът използва точно 30-те букви на българската азбука.","quiz":[{"q":"Колко букви има българската азбука?","options":["28","29","30","31"],"answer":2,"why":"Българската азбука включва 30 букви."},{"q":"Кое число е кодът на буквата А при А=1?","options":["0","1","10","30"],"answer":1,"why":"Първата буква има номер 1."},{"q":"Кой израз има стойност 6?","options":["12÷3","2×3","8−3","2+3"],"answer":1,"why":"Две по три е шест."},{"q":"Кое е най-надеждно при загадка?","options":["Предположение","Слух","Проверима улика","Случайна догадка"],"answer":2,"why":"Изводът трябва да е подкрепен с проверими данни."},{"q":"Какво означава шифър?","options":["Подредба на книги","Начин за кодиране на съобщение","Правило за деление","Карта"],"answer":1,"why":"Шифърът преобразува съобщение по определено правило."}]},{"week":1,"title":"Числово приключение","subtitle":"Изчислявай, сравнявай, обяснявай","focus":"сметки, числови закономерности, разсъждение","materials":"квадратна хартия, моливи, линия","warm":"Мислено пресмятане: капитаните показват с пръсти само крайния резултат от 8+7, 20−6 и 3×4.","task1":"Продължи редиците: а) 3, 6, 12, 24, ...; б) 2, 5, 8, 11, ...; в) 1, 4, 9, 16, ... .","task2":"Правоъгълник има страни 8 cm и 5 cm. Намери обиколката му и обясни защо не е 8×5.","mission":"Начертайте „математически остров“ с четири спирки. На всяка има задача с еднозначен отговор; верният отговор води до следващата спирка. Разменете островите между отборите.","bonus":"Състави задача с едновременно събиране и умножение, която има отговор 25.","solution":"Задача 1: а) 48; б) 14; в) 25. Задача 2: 2×(8+5)=26 cm; 8×5 намира лице, не обиколка.","quiz":[{"q":"Колко е 3/4 от 20?","options":["10","12","15","18"],"answer":2,"why":"Разделяме 20 на 4 и умножаваме по 3: 15."},{"q":"Колко е 0,5 + 0,25?","options":["0,30","0,75","0,52","0,70"],"answer":1,"why":"Половина плюс четвъртина е три четвърти."},{"q":"Колко е обиколката на квадрат със страна 6 cm?","options":["12 cm","18 cm","24 cm","36 cm"],"answer":2,"why":"Четири равни страни по 6 cm."},{"q":"Кое число е просто?","options":["9","12","13","15"],"answer":2,"why":"13 има само два положителни делителя: 1 и 13."},{"q":"След 4, 7, 10, 13 следва...","options":["14","15","16","17"],"answer":2,"why":"Всеки път прибавяме три."}]},{"week":1,"title":"Мостът на инженерите","subtitle":"Построй мост, който издържа тежест","focus":"технологии, измерване, проба и подобрение","materials":"8 листа А4 на отбор, 30 cm хартиено тиксо, две книги, малки еднакви предмети","warm":"Покажи с ръце как изглежда устойчив мост и обясни защо се нуждае от опора.","task1":"Начертай два различни вида хартиен мост между книги, разположени на 15 cm една от друга. Отбележи къде ще е товарът.","task2":"Направи предположение: дали сгънат като хармоника лист ще е по-устойчив от плосък лист? Запиши защо.","mission":"Отборът строи мост с максимум 8 листа и 30 cm тиксо. Учителят поставя постепенно еднакви безопасни малки предмети върху центъра, без стъкло или тежки товари. Запишете бройката преди огъване и предложете едно подобрение.","bonus":"Изпробвай триъгълна сгъвка и сравни с хармоника. След опита нарисувай най-устойчивата форма.","solution":"Няма единствен числен резултат. Проверете: скица, прогноза, честно измерване и поне едно обосновано подобрение.","quiz":[{"q":"Коя форма често се използва за усилване на конструкции?","options":["Кръг без опори","Триъгълник","Свободна линия","Точка"],"answer":1,"why":"Триъгълните рамки трудно променят формата си."},{"q":"С коя единица измерваме дължина?","options":["Литър","Грам","Сантиметър","Секунда"],"answer":2,"why":"Сантиметърът е единица за дължина."},{"q":"Кое прави сравнение честно?","options":["Различни товари","Еднакви условия","Различни разстояния","Смяна на правилата"],"answer":1,"why":"Сравняваме при еднакви условия."},{"q":"Какво е прототип?","options":["Първи пробен модел","Готов сертификат","Теорема","Рекламен лозунг"],"answer":0,"why":"Прототипът е модел за изпитване и подобрение."},{"q":"Къде е най-важно да се пробва мостът?","options":["Само на рисунка","При реално натоварване с безопасни предмети","Без опори","Със затворени очи"],"answer":1,"why":"Контролираният опит показва как работи мостът."}]},{"week":1,"title":"Метеоролози за един ден","subtitle":"Данни, таблици и прогноза","focus":"данни, диаграми, наблюдение","materials":"лист с квадратчета, линия, цветни моливи","warm":"Кажи по една дума за облачно, слънчево и ветровито време, без да повтаряш чужда дума.","task1":"Температури за 5 дни (°C): понеделник 12, вторник 15, сряда 13, четвъртък 17, петък 18. Начертай стълбовидна диаграма.","task2":"Определи най-топлия ден, най-студения ден и разликата между най-високата и най-ниската температура.","mission":"Всеки отбор съставя 60-секундна прогноза въз основа на *измислени* данни: температура, облачност, вятър, съвет за облекло. Изрично отбележете, че това е учебна прогноза.","bonus":"Предложи какви други данни трябват за достоверна прогноза: валежи, посока на вятъра и др.","solution":"Най-топъл: петък (18°C); най-студен: понеделник (12°C); разлика: 6°C. Диаграмата трябва да е с ос и означени единици.","quiz":[{"q":"С какво измерваме температура?","options":["Термометър","Линийка","Компас","Хронометър"],"answer":0,"why":"Температурата се измерва с термометър."},{"q":"Кой ден е най-топъл при 12, 15, 13, 17, 18°C?","options":["Понеделник","Вторник","Четвъртък","Петък"],"answer":3,"why":"Най-голямата стойност е 18°C."},{"q":"Каква е разликата между 18°C и 12°C?","options":["3°C","5°C","6°C","30°C"],"answer":2,"why":"18−12=6."},{"q":"Коя диаграма е удобна за сравняване на дни?","options":["Стълбовидна","Карта на света","Часовник","Писмо"],"answer":0,"why":"Стълбовидната диаграма показва различия между категории."},{"q":"Кое твърдение е наблюдение?","options":["„Ще вали след месец“","„В 10:00 термометърът показва 14°C“","„Лятото е най-хубаво“","„Облаците са тъжни“"],"answer":1,"why":"Посочва конкретно измерване, а не мнение или прогноза."}]},{"week":1,"title":"Олимпиада на ума","subtitle":"Пет дисциплини, пет капитани","focus":"комбинирани знания, работа под време","materials":"карти, хартия, моливи, хронометър","warm":"Всички отброяват от 30 до 0 през три: 30, 27, 24, ...; който се затрудни, получава подсказка от отбора.","task1":"Попълни: 1) 7×8=...; 2) антоним на „смел“; 3) столица на България; 4) следващото число 2, 4, 8, 16, ... .","task2":"Състави за друг отбор по един въпрос по четири области: БЕЛ, математика, природа, обща култура. Въпросите имат проверим отговор.","mission":"Проведете миниолимпиада: кръг 1 „Смятане“; 2 „Думи“; 3 „Логика“; 4 „Рисуване по описание“; 5 „Състави загадка“. Всеки кръг получава от 0 до 3 точки по предварително обявен критерий.","bonus":"Направи собствена гатанка с поне три улики и я предложи на друг отбор.","solution":"Задача 1: 56; страхлив/боязлив; София; 32. Задача 2: приемат се ясни въпроси с проверим верен отговор.","quiz":[{"q":"Колко е 7×8?","options":["54","56","58","64"],"answer":1,"why":"7×8=56."},{"q":"Коя дума е антоним на „висок“?","options":["Голям","Дълъг","Нисък","Широк"],"answer":2,"why":"Нисък е противоположно по височина."},{"q":"Коя е столицата на България?","options":["Варна","Русе","Пловдив","София"],"answer":3,"why":"Столицата е София."},{"q":"Кое число е след 2, 4, 8, 16?","options":["18","20","24","32"],"answer":3,"why":"Числата се удвояват."},{"q":"Колко минути има в един час?","options":["30","60","90","100"],"answer":1,"why":"Един час се състои от 60 минути."}]},{"week":2,"title":"Редакторите спасяват текста","subtitle":"Правопис, пунктуация и проверка","focus":"грамотност, реда на думите, редактиране","materials":"листове и химикалки, цветни моливи","warm":"„Една дума – много изречения“: за 60 секунди измислете изречения с думата „приятел“.","task1":"Редактирай текста: „вчера мария и иван отидоха в парка там видяха едно куче“.","task2":"Подреди думите в смислено изречение: „книгата / интересна / прочетох / аз / вчера“.","mission":"Създайте „редакторска служба“: един ученик пише 5 изречения по забавна история; друг редактира правопис и пунктуация; трети проверява смисъла; четвърти прави илюстрация. Представете първата и редактираната версия.","bonus":"Напиши две изречения с пряка реч и ги сравни с пример от учебника.","solution":"Пример за задача 1: „Вчера Мария и Иван отидоха в парка. Там видяха едно куче.“ Задача 2: „Аз прочетох интересната книга вчера.“ (Допуска се друго смислено подреждане с необходимите промени.)","quiz":[{"q":"С каква буква започва собственото име?","options":["С малка","С главна","С цифра","Няма правило"],"answer":1,"why":"Собствените имена започват с главна буква."},{"q":"Кое изречение е въпросително?","options":["Колко е часът?","Тук е тихо.","Ела тук!","Днес е понеделник."],"answer":0,"why":"Въпросителното изречение задава въпрос."},{"q":"Къде е нужна запетая?","options":["„Здравей Мария!“","„Здравей, Мария!“","„Здра,вей Мария“","„Здравей Мар,ия“"],"answer":1,"why":"Обръщението „Мария“ се отделя със запетая."},{"q":"Коя дума е глагол?","options":["Бърз","Планина","Тича","Син"],"answer":2,"why":"Глаголът означава действие или състояние."},{"q":"Кое е най-важно при редактиране?","options":["Само красив почерк","Правилен и ясен смисъл","Повече удивителни","Всяка дума с главна буква"],"answer":1,"why":"Редактирането подобрява правилността и яснотата."}]},{"week":2,"title":"Комикс от бъдещето","subtitle":"Разкажи история в шест кадъра","focus":"сюжет, последователност, диалог","materials":"А4, цветни моливи, линия","warm":"„Продължи историята“: всеки добавя по едно изречение към „Когато отворих вратата на класната стая...“.","task1":"Попълни план: герой, място, проблем, три действия, решение. Героят е ученик, мястото е училище през 2050 г.","task2":"Нарисувай шест правоъгълни кадъра с кратки надписи; във всеки кадър се случва нещо, което води към финала.","mission":"Създайте общ комикс „Денят, в който роботът забрави домашното“. Всеки участва в сюжет, рисунка, диалог или проверка. Представете го като „жив комикс“ с разказвач.","bonus":"Смени финала: как би изглеждала историята, ако героят избере различно решение?","solution":"Няма единствен отговор. Търсете начало, конфликт, логично развитие, завършек и участие на всички.","quiz":[{"q":"Кое е начало на разказ?","options":["Последното изречение","Представяне на място и герой","Списък с оценки","Номер на страница"],"answer":1,"why":"Началото въвежда героите и обстановката."},{"q":"Какво е диалог?","options":["Разговор между лица","Вид геометрична фигура","Списък с числа","Точно описание на предмет"],"answer":0,"why":"Диалогът представя разговор."},{"q":"Кое свързва кадрите в комикс?","options":["Случайни букви","Последователна история","Еднакъв цвят","Само заглавие"],"answer":1,"why":"Важна е причинно-следствената връзка."},{"q":"Кой елемент показва пряка реч в комикс?","options":["Облаче с текст","Линия на карта","Мерна единица","Легенда"],"answer":0,"why":"Облачетата се използват за реплики."},{"q":"Коя е добра характеристика на финал?","options":["Няма връзка с историята","Разрешава основния проблем","Повтаря само заглавието","Винаги е тъжен"],"answer":1,"why":"Завършекът следва да даде резултат на действието."}]},{"week":2,"title":"Рекламна агенция","subtitle":"Създай полезен продукт и го представи честно","focus":"убедително писане, етика на рекламата","materials":"листове, флумастери, хартия за плакати","warm":"Представете за 20 секунди обикновен молив сякаш е най-полезният предмет на света, но без неверни твърдения.","task1":"Измислете продукт, който решава малък училищен проблем. Попълнете: име, за кого е, как работи, три реалистични предимства.","task2":"Напишете два слогана (до 8 думи) и сравнете кой е по-ясен. Изберете един, без да използвате подвеждащи обещания.","mission":"Направете рекламен плакат и 45-секундно представяне. Другите отбори задават по един въпрос: „Как доказвате, че работи?“ и „Има ли недостатък?“.","bonus":"Създай кратка анти-реклама, която учи как да се разпознават преувеличения.","solution":"Преценката е по рубрика: ясно предназначение, реалистични твърдения, екипно представяне, отговор на въпрос.","quiz":[{"q":"Коя реклама е най-коректна?","options":["„Пази 100% от всичко!“","„Предназначено за съхранение на моливи“","„Най-добро завинаги“","„Вълшебно и непобедимо“"],"answer":1,"why":"Описва функция без недоказани обещания."},{"q":"Какво е слоган?","options":["Дълъг отчет","Кратко запомнящо се послание","Геометрична формула","Сметка"],"answer":1,"why":"Слоганът изразява основната идея кратко."},{"q":"За кого е предназначен продуктът? Това е...","options":["Целева група","Мерна единица","Заглавие на урок","Код"],"answer":0,"why":"Целевата група са хората, за които е полезен продуктът."},{"q":"Кое е мнение?","options":["„Листът е А4“","„Моливът е син“","„Това е най-красивият молив“","„Комплектът има 3 части“"],"answer":2,"why":"Красотата е субективна оценка."},{"q":"Кое правим при силно рекламно обещание?","options":["Вярваме веднага","Търсим доказателства","Повтаряме го","Игнорираме всичко"],"answer":1,"why":"Силните твърдения изискват проверка."}]},{"week":2,"title":"Театър без сцена","subtitle":"История, емоции и пантомима","focus":"изразяване, слушане, екипно действие","materials":"хартия, моливи, безопасни хартиени фигури","warm":"„Огледало“: по двойки едното дете прави бавни движения, другото ги повтаря; после сменят роли.","task1":"Избери 3 герои и 1 място: ученик, говорещо дърво, робот и парк. Напиши конфликт в едно изречение.","task2":"Създай сценарий от три кратки сцени: начало, усложнение, решение. Включи реплика за всеки участник.","mission":"Изиграйте 2–3-минутна пиеса или театър на хартиени фигури. Публиката отгатва главното послание. Учителят следи всички да имат спокойна роля, включително разказвач или художник.","bonus":"Промени мястото на действието и предложи нови реакции на героите.","solution":"Няма единствен отговор. Успех: ясен сюжет, диалог, изразителност, без подигравки и участие на всички.","quiz":[{"q":"Какво е сцена в пиеса?","options":["Място или обособена част от действието","Мерна единица","Резултат от деление","Машина"],"answer":0,"why":"Сцената обособява част от театралното действие."},{"q":"Коя е най-добрата роля за притеснен ученик?","options":["Никаква, изключваме го","Роля по избор, включително разказвач зад сцената","Задължително главна роля","Само зрител"],"answer":1,"why":"Ролята трябва да е доброволно съобразена с комфорта му."},{"q":"Кое помага публиката да разбере героя?","options":["Ясна реч и движение","Говорене наведнъж","Шум","Обърнат гръб през цялото време"],"answer":0,"why":"Достъпното представяне помага за разбиране."},{"q":"Кое прави диалога по-естествен?","options":["Слушане на партньора","Прекъсване на всички","Без паузи","Четене на чуждите реплики"],"answer":0,"why":"Разговорът предполага редуване и слушане."},{"q":"Как реагираме след сценка?","options":["Подиграваме се","Даваме конкретна добра обратна връзка","Сравняваме деца","Излизаме без дума"],"answer":1,"why":"Обратната връзка трябва да е уважителна и конкретна."}]},{"week":2,"title":"Медийни детективи","subtitle":"Факт, мнение, слух и източник","focus":"медийна грамотност, аргументи","materials":"листове, химикалки, екран","warm":"Учителят чете 3 твърдения; отборите показват с ръце „Ф“ за факт или „М“ за мнение.","task1":"Раздели: а) „Земята обикаля около Слънцето.“ б) „Лятото е най-хубавият сезон.“ в) „В триъгълника има 3 страни.“ г) „Тази рисунка е прекрасна.“","task2":"Виж съобщението: „Утре всички занятия се отменят!“ Няма дата, автор и източник. Напиши 3 проверки преди да го споделиш.","mission":"Екипът изработва постер „Проверявам, преди да вярвам“ с 5 правила: автор, дата, източник, второ потвърждение, цел на съобщението. Представя две измислени заглавия и оценява кое е проверимо.","bonus":"Обясни разликата между шега, реклама и достоверно новинарско съобщение.","solution":"Задача 1: факти а), в); мнения б), г). Задача 2: проверка в официалния канал на училището, на датата и при учител/родител.","quiz":[{"q":"Кое е мнение?","options":["„София е столица“","„Един час има 60 минути“","„Зимата е най-приятният сезон“","„Триъгълникът има 3 страни“"],"answer":2,"why":"Това е лична оценка."},{"q":"Кое проверяваме първо в непозната публикация?","options":["Колко емотикони има","Автор и източник","Цвета на заглавието","Броя харесвания"],"answer":1,"why":"Източникът помага за проверка на достоверността."},{"q":"Кое е достоверно доказателство за учебно съобщение?","options":["Слух в чат","Официален канал на училището","Неизвестен коментар","Случайна снимка"],"answer":1,"why":"Официалното съобщение може да се потвърди."},{"q":"Какво правим преди да споделим слух?","options":["Споделяме веднага","Проверяваме фактите","Добавяме сензация","Премахваме датата"],"answer":1,"why":"Проверката предотвратява разпространение на неверни твърдения."},{"q":"Кое е знак за подозрително заглавие?","options":["Уточнен източник","Точна дата","„Шок! Всички крият истината!“ без доказателства","Автор и документ"],"answer":2,"why":"Сензационното заглавие без доказателства е предупредителен сигнал."}]},{"week":3,"title":"Животът в гората","subtitle":"Построй хранителна верига","focus":"екосистеми, връзки между организми","materials":"карти с животни и растения, моливи","warm":"„Познай животното“ по три характеристики, без да се издава името му.","task1":"Подреди хранителната верига: трева, заек, лисица. Начертай стрелки от храната към този, който я използва.","task2":"Напиши две промени, ако зайците силно намалеят. Обсъдете, че действителните екосистеми са по-сложни от една верига.","mission":"Отборите проектират горски плакат с поне 6 организма и минимум две свързани хранителни вериги. Означете продуценти и консументи. Защитете коя промяна може да засегне цялата система.","bonus":"Нарисувай хранителна мрежа с 2 растения, 2 тревопасни и 2 хищника.","solution":"Задача 1: трева → заек → лисица. Задача 2: по-малко храна за някои хищници; възможно повече трева, но зависи от други фактори.","quiz":[{"q":"Кое е производител (продуцент)?","options":["Трева","Лисица","Заек","Орел"],"answer":0,"why":"Зелените растения произвеждат органични вещества чрез фотосинтеза."},{"q":"Кой е консумент?","options":["Дъб","Мъх","Заек","Трева"],"answer":2,"why":"Заекът се храни с готова органична храна."},{"q":"Стрелка трева → заек означава...","options":["Заекът яде трева","Тревата яде заек","Нямат връзка","Заекът е растение"],"answer":0,"why":"Стрелката показва посоката на пренос на храна/енергия."},{"q":"Защо са важни разнообразните видове?","options":["Не са важни","Свързани са в екосистема","Всички ядат едно","Всички са еднакви"],"answer":1,"why":"Разнообразието поддържа множество взаимовръзки."},{"q":"Кое е разумно поведение в гора?","options":["Да оставим боклук","Да късаме всичко","Да пазим местообитанията","Да палим огън навсякъде"],"answer":2,"why":"Опазването на местообитанията защитава организмите."}]},{"week":3,"title":"Пътешествието на капката","subtitle":"Кръговратът на водата","focus":"природни процеси, последователност","materials":"хартия, цветни моливи, прозрачен съд само при възрастен","warm":"Всеки казва един начин, по който използваме вода, без да повтаря предишен.","task1":"Подреди: валежи, изпарение, кондензация, събиране на вода. Начертай цикъл със стрелки.","task2":"Обясни с едно изречение защо мокрите дрехи могат да изсъхнат и без да завали.","mission":"Създайте комикс „Дневникът на една капка“ с 6 сцени. Включете Слънцето, изпарение, облак, валежи и връщане към водоем. Учителят може да демонстрира конденз върху студен съд; без гореща вода при децата.","bonus":"Предложи два начина за пестене на вода в училище, които може да се изпълнят.","solution":"Задача 1: вода → изпарение → кондензация → валежи → събиране на вода. Задача 2: водата преминава във водна пара и се смесва с въздуха.","quiz":[{"q":"Как се нарича превръщането на течна вода във водна пара?","options":["Замръзване","Изпарение","Топене","Кондензация"],"answer":1,"why":"При изпарението течната вода става водна пара."},{"q":"Кога възникват облачни капчици?","options":["При кондензация","При горене","При магнитизъм","При рязане"],"answer":0,"why":"Водната пара може да се кондензира в капчици."},{"q":"Кое е вид валеж?","options":["Мъгла","Сняг","Вятър","Облак"],"answer":1,"why":"Снегът достига земната повърхност като валеж."},{"q":"Кое поддържа голяма част от кръговрата на водата?","options":["Слънчевата енергия","Шумът","Сянката","Електрически кабел"],"answer":0,"why":"Слънцето осигурява енергия за изпарение."},{"q":"Какво е пестене на вода?","options":["Течащ кран без причина","Затваряне на крана","Изливане на чиста вода","Излишно пълнене"],"answer":1,"why":"Кранът се затваря, когато водата не се използва."}]},{"week":3,"title":"Мисия до Марс","subtitle":"Планирай космически полет","focus":"астрономия, планиране, ограничения","materials":"листове, цветни моливи, картон","warm":"Познай планетата по описание: „Червената планета“.","task1":"Подреди първите четири планети от Слънцето: Марс, Венера, Меркурий, Земя.","task2":"Избери 5 от 8 предмета за учебна космическа мисия: вода, храна, аптечка, кислород, карта, играчка, възглавница, ски. Обоснови кои са жизнено важни и защо.","mission":"Всеки отбор проектира космическа база: зона за живот, енергия, храна, безопасност, комуникация. Подгответе 90-секунден доклад и обяснете едно инженерно затруднение.","bonus":"Напиши кратко писмо от учен-изследовател на Марс, без да представяш измислицата като реален полет.","solution":"Задача 1: Меркурий, Венера, Земя, Марс. Задача 2: водата, храната, аптечката и кислородът са приоритет; петият избор зависи от целта и обосновката.","quiz":[{"q":"Коя е най-близката планета до Слънцето?","options":["Венера","Меркурий","Земя","Марс"],"answer":1,"why":"Меркурий е първата планета."},{"q":"Как наричаме Марс?","options":["Зелената планета","Червената планета","Синята звезда","Ледената луна"],"answer":1,"why":"Повърхността му изглежда червеникава."},{"q":"Коя планета е домът ни?","options":["Марс","Венера","Земя","Юпитер"],"answer":2,"why":"Живеем на Земята."},{"q":"Какво е Слънцето?","options":["Планета","Луна","Звезда","Комета"],"answer":2,"why":"Слънцето е звезда."},{"q":"Кое е основно условие за живот на човек в космически кораб?","options":["Кислород","Ски","Плаж","Бонбони"],"answer":0,"why":"Нужна е среда, която осигурява дишане."}]},{"week":3,"title":"Енергийните детективи","subtitle":"Намери пътища за икономия на енергия","focus":"енергия, безопасност, отговорно потребление","materials":"листове, маркери","warm":"Назови предмет у дома, който работи с електричество, без да повтаряш вече назован.","task1":"Класифицирай: слънчев панел, свещ, вентилатор, велосипед. Кои използват електричество при обичайна употреба?","task2":"При еднаква мощност кое изразходва повече енергия: лампа, работеща 1 час, или същата лампа, работеща 3 часа? Обясни.","mission":"Изгответе „Енергиен одит на класната стая“ без докосване на контакти и кабели. Запишете 5 навика за пестене на електроенергия и отговорните за тях. Представете правилата на плакат.","bonus":"Измисли „зелено предизвикателство“ за седмицата с една измерима цел.","solution":"Задача 1: слънчевият панел произвежда електричество; вентилаторът обикновено използва електричество; свещта и обикновеният велосипед не се нуждаят от него. Задача 2: 3 часа, при една и съща мощност.","quiz":[{"q":"Кое е безопасно?","options":["Бъркане в контакт","Пипане на оголени кабели","Съобщаване на възрастен за повреда","Опит за ремонт без учител"],"answer":2,"why":"Електроуредите и повредите са работа за възрастен специалист."},{"q":"Кое използва слънчева енергия?","options":["Соларен панел","Тиксо","Молив","Тетрадка"],"answer":0,"why":"Соларният панел преобразува слънчева енергия."},{"q":"При еднаква мощност повече енергия изразходва...","options":["Работа 1 час","Работа 3 часа","Еднакво е","Няма връзка"],"answer":1,"why":"По-дългото време води до по-голям разход."},{"q":"Кога е разумно да изгасим лампата?","options":["Когато помещението не се използва","Когато учим на тъмно","Винаги","Никога"],"answer":0,"why":"Неоснователното осветление хаби енергия."},{"q":"Кое е възобновяем източник?","options":["Въглища","Слънце","Нефт","Природен газ"],"answer":1,"why":"Слънчевата енергия се възобновява естествено."}]},{"week":3,"title":"Лаборатория хартиени самолети","subtitle":"Как се прави честен експеримент?","focus":"хипотези, измерване, сравнение","materials":"по 2 листа A4 на отбор, рулетка/линия, безопасно свободно пространство","warm":"Всеки описва с една дума какво влияе върху полета на хартиен самолет.","task1":"Напиши хипотеза: „Ако променим само ширината на крилата, очаквам ... защото ...“.","task2":"Начертай таблица с колони „Модел“, „Опит 1“, „Опит 2“, „Опит 3“, „Средно разстояние“.","mission":"Сгънете два хартиени самолета с една разлика в дизайна. От една и съща линия, с еднакъв хвърлящ и безопасна посока, направете по 3 опита. Измерете дистанцията и сравнете средните стойности. Никой не хвърля към хора.","bonus":"Обсъди кои фактори могат да объркат резултата: сила на хвърляне, течение, различен самолет.","solution":"Средното е (опит1+опит2+опит3)÷3. Няма предварително зададен победител; важно е контролираното сравнение.","quiz":[{"q":"Какво е хипотеза?","options":["Предположение за проверка","Доказан закон","Задължителен резултат","Рекламно обещание"],"answer":0,"why":"Хипотезата е проверимо предположение."},{"q":"Колко опита правим на модел в задачата?","options":["1","2","3","5"],"answer":2,"why":"Условието предвижда три опита."},{"q":"Кое е честно сравнение?","options":["Два различни хвърлящи","Една и съща стартова линия","Единият от прозорец","Различен вятър"],"answer":1,"why":"Началните условия трябва да са еднакви."},{"q":"Средно от 3, 6 и 9 метра е...","options":["3 m","6 m","9 m","18 m"],"answer":1,"why":"(3+6+9)/3=6."},{"q":"Кое е безопасно при опитите?","options":["Хвърляне към хора","Свободна безопасна посока","Тичане през коридора","Качване на стол"],"answer":1,"why":"Използваме свободно място и не целим хора."}]},{"week":4,"title":"Градът на бъдещето","subtitle":"Планирай удобен и зелен град","focus":"пространствено мислене, граждански решения","materials":"голям лист, линия, цветни моливи","warm":"„Какво липсва?“: избройте важни места в град; друг отбор намира кое не е включено.","task1":"На лист раздели терен на 4 квартала. Означи училище, парк, болница и библиотека, без да ги поставяш в опасни места.","task2":"Измисли 3 правила за безопасно придвижване и 2 мерки за повече зеленина.","mission":"Създайте карта на град с легенда, маршрут от дом до училище, велоалея или пешеходна зона и място за почивка. Представете защо маршрутът е безопасен и достъпен.","bonus":"Включи идея, която улеснява придвижването на човек с количка или друг ограничен достъп.","solution":"Няма единствена карта. Търсете легенда, основни обществени услуги, безопасен маршрут и обоснован избор.","quiz":[{"q":"Какво показва легендата на карта?","options":["Значението на символите","Оценките в класа","Времето на часовника","Височината на хората"],"answer":0,"why":"Легендата разяснява символите."},{"q":"Кое е обществено място?","options":["Библиотека","Лично чекмедже","Чужд телефон","Личен дневник"],"answer":0,"why":"Библиотеката обслужва общността."},{"q":"Кое е безопасен маршрут до училище?","options":["През натоварено кръстовище без пресичане","По тротоар и обозначена пешеходна пътека","По релсите","През строеж"],"answer":1,"why":"Спазват се местата за безопасно придвижване."},{"q":"За какво служи паркът?","options":["За почивка и зеленина","Само за автомобили","За отпадъци","За кабели"],"answer":0,"why":"Паркът осигурява обществено зелено пространство."},{"q":"Кое прави град достъпен?","options":["Стълби навсякъде","Рампи и понижени бордюри","Затворени тротоари","Липса на табели"],"answer":1,"why":"Достъпността позволява движение на повече хора."}]},{"week":4,"title":"Пътешествие из България","subtitle":"Планирай маршрут и туристически плакат","focus":"география, работа с карта, избор","materials":"карта на България/атлас, хартия, моливи","warm":"Всяко дете назовава природна или културна забележителност в България.","task1":"Съотнеси: Черно море – изток; Дунав – север; Рила – планина; София – столица.","task2":"Изберете 3 спирки за измислена учебна екскурзия. Напишете по едно изречение какво може да се научи на всяка.","mission":"Създайте туристически плакат и маршрут с посока на движение. Проверете на карта дали градовете са в разумен ред и представете правилата за безопасно групово пътуване.","bonus":"Предложи екскурзия с нисък отпечатък върху природата: вода в бутилка за многократна употреба, без отпадъци и др.","solution":"Задача 1: предложените посоки и обекти са правилни. Маршрутът се оценява по карта, описани причини и реализъм; не е нужно да пресмятат реални времена.","quiz":[{"q":"Кое море е на изток от България?","options":["Средиземно","Черно","Балтийско","Червено"],"answer":1,"why":"Българското Черноморие е на изток."},{"q":"Коя река образува значителна част от северната ни граница?","options":["Искър","Марица","Дунав","Струма"],"answer":2,"why":"Дунав тече по голяма част от северната граница."},{"q":"Коя е най-високата планина в България?","options":["Рила","Странджа","Сакар","Люлин"],"answer":0,"why":"Мусала в Рила е най-високият връх."},{"q":"Кой инструмент помага за ориентиране?","options":["Компас","Термометър","Хронометър","Кантар"],"answer":0,"why":"Компасът показва посока."},{"q":"Кое пази природата по време на разходка?","options":["Боклук в гората","Движение по пътеки и прибиране на отпадъци","Късане на редки растения","Шум до животните"],"answer":1,"why":"Съобразяваме се с природната среда."}]},{"week":4,"title":"Магазин с бюджет","subtitle":"Планирай покупките на отбор","focus":"финансова грамотност, изчисления, приоритети","materials":"карти с цени, моливи, листове","warm":"Класирайте думите „нужда“, „желание“, „спестяване“ с по един пример.","task1":"Имате 60 учебни жетона. Цени: тетрадка 8, моливи 6, книга 18, настолна игра 25, бутилка вода 5, стикери 7. Избери покупки за точно 40 жетона.","task2":"Ако купите книга (18), тетрадка (8) и моливи (6), колко жетона остават от 60?","mission":"Отборът планира малка библиотечна кутия с бюджет 60 жетона. Направете таблица: покупки, цена, общо, остатък, причина за избора. Друг отбор играе ролята на „проверяващи“ и търси грешки в сметката.","bonus":"Създай нов каталог с шест продукта и цени, които са цели числа от 1 до 20, и измисли бюджетна задача.","solution":"Задача 1: настолна игра 25 + тетрадка 8 + стикери 7 = 40 жетона. Задача 2: 60−32=28 жетона.","quiz":[{"q":"Кое е пример за нужда?","options":["Вода за пиене","Пета еднаква играчка","Още стикери","Случаен сувенир"],"answer":0,"why":"Водата е основна потребност."},{"q":"Колко остават от 60 след покупка за 18?","options":["22","32","42","48"],"answer":2,"why":"60−18=42."},{"q":"Кое е разумно при ограничен бюджет?","options":["Всичко наведнъж","Да сравним нуждите и цените","Да не смятаме","Да купим най-скъпото"],"answer":1,"why":"Планираме разходите според приоритетите."},{"q":"Колко е 8+6+18?","options":["30","31","32","34"],"answer":2,"why":"8+6+18=32."},{"q":"Какво е остатък?","options":["Непохарчената част от бюджета","Първоначалната цена","Броят вещи","Име на магазин"],"answer":0,"why":"Остатъкът са неизразходваните средства."}]},{"week":4,"title":"Съветът на класа","subtitle":"Вземане на решения и уважителен дебат","focus":"аргументи, слушане, демократични процедури","materials":"карти „за“ и „против“, листове","warm":"Назовете едно правило, което помага на класа да работи спокойно.","task1":"Тема: „Да има ли 15 минути свободно четене всеки ден?“ Напиши по 2 аргумента „за“ и 2 възможни затруднения.","task2":"Избери най-силния си аргумент и добави конкретен пример, който го подкрепя.","mission":"Организирайте заседание на класен съвет. Роли: водещ, говорители, секретар, наблюдател на правилата. Всеки екип представя предложение за занималнята; останалите задават въпроси; накрая гласуват за изпълним вариант.","bonus":"Направи предложение, което взема предвид нуждите на децата, предпочитащи по-тихи дейности.","solution":"Няма единствено становище. Оценете уважително изслушване, аргумент с пример, изпълнимост и справедливо участие.","quiz":[{"q":"Какво е аргумент?","options":["Причина в подкрепа на мнение","Обидна дума","Случайно число","Рисунка"],"answer":0,"why":"Аргументът обяснява и защитава позиция."},{"q":"Как се води добър дебат?","options":["Всички говорят едновременно","Слушаме и говорим по ред","Прекъсваме","Лично нападаме"],"answer":1,"why":"Уважителният разговор има правила за редуване."},{"q":"Кое е добър пример за правило?","options":["Само капитанът решава","Даваме думата на всеки","Никой не пита","Смеем се на грешките"],"answer":1,"why":"Всяко дете трябва да има шанс за участие."},{"q":"Кога гласуването е по-справедливо?","options":["Когато само двама гласуват","Когато всички имат право на глас","Когато няма правила","Когато не се броят гласовете"],"answer":1,"why":"Всички засегнати участници имат право на участие според договорения ред."},{"q":"Кое е компромис?","options":["Решение с взаимни отстъпки","Крясък","Забрана за мнение","Тайна команда"],"answer":0,"why":"Компромисът отчита повече от една гледна точка."}]},{"week":4,"title":"Големият финал: Остров Мисия 5","subtitle":"Пет зони, пет умения, едно общо приключение","focus":"преговор, прилагане на умения, партньорство","materials":"карти от предишните дни, листове, цветни моливи","warm":"Всеки отбор избира емблема и споделя едно умение, което е усвоил през месеца.","task1":"Зона 1: изчисли (24÷6)+7. Зона 2: подреди думите „мисия / успешна / беше / нашата“ в изречение.","task2":"Зона 3: нарисувай стрелки трева – заек – лисица. Зона 4: запиши 2 проверки на подозрително съобщение. Зона 5: предложи едно подобрение на училищния двор.","mission":"Всеки отбор създава плакат „Нашата експедиция“: задача, която решихме, умение, което развихме, смешен момент, идея за следващия месец. Следва разходка по галерията и позитивна обратна връзка.","bonus":"Направи лична карта „Моето суперумение“: в какво успях, на кого помогнах, какво искам да опитам.","solution":"Зона 1: 11. Зона 2: „Нашата мисия беше успешна.“ Зона 3: трева → заек → лисица. Зони 4 и 5: приемат се обосновани отговори.","quiz":[{"q":"Колко е (24÷6)+7?","options":["9","10","11","13"],"answer":2,"why":"24÷6=4; 4+7=11."},{"q":"Кое е най-добро доказателство за новина?","options":["Неизвестен коментар","Проверим официален източник","Харесвания","Голяма снимка"],"answer":1,"why":"Източникът и потвърждението са решаващи."},{"q":"Какво има една добра карта?","options":["Само рисунка","Легенда и означения","Само име","Само подпис"],"answer":1,"why":"Означенията правят картата четима."},{"q":"Какво е най-важно в отбор?","options":["Да участва само един","Да се чуват всички","Да се карат","Да се бърза без проверка"],"answer":1,"why":"Споделеното участие води до по-добра работа."},{"q":"Кое следва след експеримент?","options":["Да скрием резултата","Да сравним данните и направим извод","Да сменим спомените","Да забравим условието"],"answer":1,"why":"Заключението трябва да следва от измерванията."}]}];
const $=id=>document.getElementById(id);
const names=['Откриватели','Изобретатели','Изследователи','Творци','Звездолети'];
let day=0,index=0,tab='quiz',revealed=false,selected=-1;
let scores=[0,0,0,0,0],teams=[...names],lastTimer=20*60,remain=lastTimer,running=false,lastTick=0,interval=null;
function textSafe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function load(){try{const x=JSON.parse(localStorage.getItem('mission5v1')||'null');if(x){scores=Array.isArray(x.scores)&&x.scores.length===5?x.scores:scores;teams=Array.isArray(x.teams)&&x.teams.length===5?x.teams:teams;day=Math.min(19,Math.max(0,Number(x.day)||0));}}catch(e){}}
function save(){try{localStorage.setItem('mission5v1',JSON.stringify({scores,teams,day}));}catch(e){}}
function setDay(i){day=Number(i);index=0;revealed=false;selected=-1;$('daySelect').value=String(day);$('weekLabel').textContent='Седмица '+DAYS[day].week+' · Ден '+String(day+1).padStart(2,'0');$('dayTitle').textContent=DAYS[day].title;$('daySubtitle').textContent=DAYS[day].subtitle;save();render();}
function setTab(t){tab=t;for(const el of document.querySelectorAll('[data-tab]'))el.setAttribute('aria-selected',el.dataset.tab===t?'true':'false');render();}
function render(){if(tab==='quiz')renderQuiz();else if(tab==='activities')renderActivities();else if(tab==='score')renderScore();else renderPlan();}
function renderQuiz(){const q=DAYS[day].quiz[index],s='АБВГ';let body=`<div class="inner"><div class="topRow"><div class="over">Въпрос ${index+1} от 5</div><div class="small">Отборите показват А, Б, В или Г</div></div><div class="progress"><span style="width:${(index+1)*20}%"></span></div><div class="question">${textSafe(q.q)}</div><div class="options">`;
 q.options.forEach((opt,i)=>{let c=(revealed?(i===q.answer?'correct':'wrong'):'');body+=`<button class="option ${c}" ${revealed?'disabled':''} data-answer="${i}"><span>${s[i]}</span><div>${textSafe(opt)}</div></button>`;});
 body+='</div><div class="buttons"><button class="primary" id="reveal">'+(revealed?'✓ Отговорът е показан':'Покажи верния отговор')+'</button><button class="btn" id="prevQuestion">← Предишен</button><button class="btn" id="nextQuestion">'+(index===4?'Отначало ↻':'Следващ →')+'</button></div>';
 if(revealed)body+=`<div class="expl"><b>Верен отговор: ${s[q.answer]}) ${textSafe(q.options[q.answer])}</b><br>${textSafe(q.why)}</div>`;
 body+='</div>';$('content').innerHTML=body;
 $('reveal').onclick=()=>{revealed=true;renderQuiz();};$('prevQuestion').onclick=()=>{index=Math.max(0,index-1);revealed=false;renderQuiz();};$('nextQuestion').onclick=()=>{index=(index+1)%5;revealed=false;renderQuiz();};
 document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>{selected=Number(el.dataset.answer);revealed=true;renderQuiz();});
}
function renderActivities(){let d=DAYS[day],list=[['Загряване','10 мин',d.warm],['Задача 1 — отборен лист','20 мин',d.task1],['Задача 2 — отборен лист','20 мин',d.task2],['Голяма мисия','40 мин',d.mission],['Бонус за ранно приключили','10–15 мин',d.bonus]];
 $('content').innerHTML=`<div class="inner"><h2>Днешните предизвикателства</h2><div class="small">Не е нужно всички задачи да стоят на екрана едновременно. Учителят ги представя поетапно.</div>${list.map(v=>`<article class="activity"><h3>${textSafe(v[0])} <span class="time">· ${v[1]}</span></h3><p>${textSafe(v[2])}</p></article>`).join('')}<details class="teacher"><summary>🔐 Само за учителя: проверка и отговори</summary><div>${textSafe(d.solution)}</div></details><div class="buttons"><button class="btn" id="toScore">Към точките на отборите →</button></div></div>`;$('toScore').onclick=()=>setTab('score');}
function renderScore(){let cards=teams.map((team,i)=>`<div class="scorebox"><input class="teamname" aria-label="Име на отбор ${i+1}" data-name="${i}" value="${textSafe(team)}" maxlength="28"><div class="points">${scores[i]}</div><div class="scorebuttons"><button aria-label="Минус 1 точка" data-minus="${i}">−1</button><button class="plus" aria-label="Плюс 1 точка" data-plus="${i}">+1</button></div></div>`).join('');
 $('content').innerHTML=`<div><h2>Точки на отборите</h2><p class="small">Точките са мотивационни, не са оценки. Давайте ги за добри аргументи, помощ и работа в екип.</p><div class="score-grid">${cards}</div><div class="winner" id="randomResult">Изберете случаен отбор за представяне.</div><div class="buttons"><button class="primary" id="pick">🎲 Случаен отбор</button><button class="ghost" id="resetScores">Нулирай точките</button></div></div>`;
 document.querySelectorAll('[data-plus]').forEach(el=>el.onclick=()=>{let i=+el.dataset.plus;scores[i]++;save();renderScore();});document.querySelectorAll('[data-minus]').forEach(el=>el.onclick=()=>{let i=+el.dataset.minus;scores[i]=Math.max(0,scores[i]-1);save();renderScore();});document.querySelectorAll('[data-name]').forEach(el=>el.onchange=()=>{teams[+el.dataset.name]=el.value.trim()||names[+el.dataset.name];save();});
 $('pick').onclick=()=>{let i=Math.floor(Math.random()*5);$('randomResult').textContent='🎉 Представя: '+teams[i];};$('resetScores').onclick=()=>{if(confirm('Да се нулират ли всички точки?')){scores=[0,0,0,0,0];save();renderScore();}};
}
function renderPlan(){const rows=[['00–10','Загряваща игра'],['10–35','Викторина на дъската'],['35–75','Работни листове по отбори'],['75–85','Почивка'],['85–125','Голяма мисия'],['125–145','Представяне на отборите'],['145–150','Обобщение и подреждане']];$('content').innerHTML=`<div class="inner"><h2>Дневна програма за 150 минути</h2>${rows.map(x=>`<article class="activity" style="display:flex;gap:24px;align-items:center"><b style="color:var(--accent);white-space:nowrap">${x[0]} мин</b><span>${x[1]}</span></article>`).join('')}<p class="notice">При 120 минути: 5 + 15 + 30 + 10 + 35 + 20 + 5 мин. При 180 минути: добавете 15 мин четене и 15 мин бонус мисия.<br><br>Материали днес: <strong>${textSafe(DAYS[day].materials)}</strong>.</p></div>`;}
function renderTimer(){let m=Math.floor(remain/60),s=remain%60;$('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('startTimer').textContent=running?'❚❚ Пауза':'▶ Старт';}
function toggleTimer(){running=!running;lastTick=Date.now();renderTimer();}
function resetTimer(){running=false;remain=lastTimer;renderTimer();}
function tick(){if(!running)return;const now=Date.now();const delta=Math.floor((now-lastTick)/1000);if(delta>0){remain=Math.max(0,remain-delta);lastTick+=delta*1000;renderTimer();if(remain===0){running=false;renderTimer();$('time').style.color='var(--red)';setTimeout(()=>{$('time').style.color='var(--gold)'},5000);}}}
load();let sel=$('daySelect');DAYS.forEach((d,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`Ден ${String(i+1).padStart(2,'0')} · ${d.title}`;sel.append(o);});sel.onchange=e=>setDay(+e.target.value);document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>setTab(el.dataset.tab));document.querySelectorAll('[data-min]').forEach(el=>el.onclick=()=>{lastTimer=remain=(+el.dataset.min)*60;running=false;renderTimer();});$('startTimer').onclick=toggleTimer;$('resetTimer').onclick=resetTimer;setInterval(tick,250);
$('fullscreen').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{});}else{document.exitFullscreen?.().catch(()=>{});}};
setDay(day);renderTimer();
</script>
</body></html>
